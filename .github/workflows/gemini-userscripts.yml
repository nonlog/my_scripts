name: Gemini userscripts

on:
  push:
    paths:
      - 'gemini-*.user.js'
      - 'gemini-*.meta.js'
      - 'tests/gemini-*.test.cjs'
      - '.github/workflows/gemini-userscripts.yml'
  pull_request:
    paths:
      - 'gemini-*.user.js'
      - 'gemini-*.meta.js'
      - 'tests/gemini-*.test.cjs'
      - '.github/workflows/gemini-userscripts.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check Gemini userscript and metadata
        run: |
          node --check gemini-usage-timeline.user.js
          node --check gemini-usage-timeline.meta.js
      - name: Run Gemini userscript tests
        run: node --test tests/gemini-usage-timeline.test.cjs
